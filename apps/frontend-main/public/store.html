<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Turf | Rewards Store</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
    <script src="js/socket-client.js" defer></script>
    <style>
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .store-item { background: var(--bg-card); border-radius: 12px; padding: 15px; border: 1px solid var(--border); transition: transform 0.2s; display: flex; flex-direction: column; }
        .store-item:hover { transform: translateY(-5px); border-color: var(--accent-secondary); }
        .store-img { width: 100%; height: 150px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: rgba(255,255,255,0.05); display:flex; align-items:center; justify-content:center; }
        .store-title { font-weight: bold; font-size: 1.1rem; margin-bottom: 5px; }
        .store-desc { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; flex: 1; }
        .store-footer { display: flex; justify-content: space-between; align-items: center; }
        .store-cost { font-weight: bold; color: var(--accent-orange); }
        .store-stock { font-size: 0.75rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <canvas id="three-bg"></canvas>
    <div class="toast-container" id="toast-container"></div>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">TECH TURF</div>
            </div>
            <nav class="sidebar-menu">
                <div class="menu-item" onclick="window.location.href='dashboard.html'">
                    <i class="fas fa-th-large"></i>
                    <span class="menu-text">Back to Dashboard</span>
                </div>
                <div class="menu-item active">
                    <i class="fas fa-store"></i>
                    <span class="menu-text">Rewards Store</span>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="navbar">
                <div class="nav-left"></div>
                <div class="nav-actions">
                    <div class="user-profile-nav" data-nav="profile.html">
                        <div class="user-nav-text">
                            <div id="nav-user-name" class="user-nav-name">User Name</div>
                            <div id="nav-user-role" class="user-nav-role">Role</div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="page-header" style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <div class="breadcrumb">Overview / Rewards</div>
                    <div class="page-title">GAMIFICATION STORE</div>
                </div>
                <div style="background:var(--bg-card); padding:10px 20px; border-radius:30px; border:1px solid var(--accent-orange);">
                    <i class="fas fa-star" style="color:var(--accent-orange);"></i> My Points: <strong id="my-points">...</strong>
                </div>
            </div>

            <div class="glass-card" style="padding: 20px;">
                <div class="store-grid" id="store-grid">
                    Loading items...
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/store.js"></script>
</body>
</html>
